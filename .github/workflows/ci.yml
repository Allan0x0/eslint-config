name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ["9", "10"]
    name: ESLint ${{ matrix.eslint }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use ESLint ${{ matrix.eslint }}
        run: pnpm add -D eslint@^${{ matrix.eslint }}
      - run: pnpm test
